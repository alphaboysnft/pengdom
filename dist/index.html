<script>
const $=s=>document.querySelector(s);let lastFocus,mood='UNBOTHERED',score=0,timer,remaining=20,audio,sounding=false;

const pages={story:['PENG.exe — about this bird',`<span class="pill">A PENGUIN COMMUNITY</span><h2>Same bird.<br>Different energy.</h2><p>PENG is an unbothered penguin with a tiny igloo and unnecessarily big plans. This is a place for good memes, strange ideas, and people who make the internet a little more fun.</p><div class="card"><strong>Stay cold. Move bold.</strong><p>Make something. Make a friend. Make absolutely no sense. You're home.</p></div><p class="notice">PENG is an early community concept. No token is live, and there is no wallet connection or token sale here.</p>`],memes:['meme_fridge / fresh daily-ish',`<h2>Fresh from<br>the cold folder.</h2><p>Original starter memes. Click one to turn it into a shareable card.</p><button class="action" data-meme="MY PORTFOLIO? MOSTLY FISH.">MY PORTFOLIO? MOSTLY FISH.</button><button class="action" data-meme="TOUCH SNOW.">TOUCH SNOW.</button><button class="action" data-meme="ZERO BUDGET. BIG IGLOO ENERGY.">ZERO BUDGET. BIG IGLOO ENERGY.</button><p class="notice">Community submissions will come later. For now, help yourself to a cold one.</p>`],plans:['noticeboard.txt',`<h2>Small igloo.<br>Big plans.</h2><div class="card"><span class="eyebrow">01 / NOW</span><p>Build the character. Open the igloo. Make the first memes.</p></div><div class="card" style="background:#e0e9d9"><span class="eyebrow">02 / NEXT</span><p>Gather the colony. Community art, better games, and new corners to explore.</p></div><div class="card" style="background:#f3dfbe"><span class="eyebrow">03 / EXPLORE</span><p>Discover what PENG can become together. Any token would need a separate, clear plan.</p></div>`],radio:['colony_radio / not broadcasting yet',`<h2>Find your<br>kind of cold.</h2><p>The community channels haven't launched yet. Official links will appear here when they're ready.</p><div class="card"><strong>Transmission pending…</strong><p>In the meantime, make a mood card or set a fish-catching record.</p></div><button class="action" data-next="mood">MAKE A MOOD CARD ↗</button><button class="action" data-next="arcade">PLAY ARCADE ↗</button>`],arcade:['fish.exe / just one more round',`<h2>Fish now.<br>Overthink later.</h2><p>Catch as many fish as you can in 20 seconds. Tap or click them.</p><p class="status" id="stats">SCORE 0 · TIME 20s</p><div id="game"></div><button class="action" id="startgame">START FISHING ↗</button><p class="notice" id="best"></p>`],mood:['mood_maker.exe',`<h2>Peng your mood.</h2><p>Pick an energy. Take your bird to the internet.</p><div class="moods">${['UNBOTHERED','BROKE','COOKING','ABSOLUTE CHAOS'].map(m=>`<button data-mood="${m}" class="${m===mood?'selected':''}">${m}</button>`).join('')}</div><canvas id="card" width="1000" height="700" aria-label="Your downloadable PENG mood card"></canvas><button class="action" id="download">DOWNLOAD CARD ↓</button>`]};
function close(){clearInterval(timer);$('#modal').classList.remove('active');lastFocus?.focus()}
function openPage(id){if(id==='profile'){openProfile();return;}if(id==='tasks'){enterComputer();return;}clearInterval(timer);lastFocus=document.activeElement;let [title,html]=pages[id];$('#windowtitle').textContent=title;$('#content').innerHTML=html;$('#modal').classList.add('active');$('.close').focus();if(id==='mood'){drawCard();$('#download').onclick=()=>{let a=document.createElement('a');a.download='peng-mood.png';a.href=$('#card').toDataURL();a.click()}}if(id==='arcade'){$('#best').textContent='PERSONAL BEST: '+(localStorage.getItem('peng-best')||0);$('#startgame').onclick=startGame}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.open)openPage(b.dataset.open);if(b.dataset.next)openPage(b.dataset.next);if(b.dataset.mood){mood=b.dataset.mood;document.querySelectorAll('[data-mood]').forEach(x=>x.classList.toggle('selected',x===b));drawCard()}if(b.dataset.meme){mood=b.dataset.meme;openPage('mood')}});$('.close').onclick=close;$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('#modal').classList.contains('active')){let els=[...$('#modal').querySelectorAll('button')];let first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function drawCard(){let c=$('#card'),x=c.getContext('2d');x.fillStyle=mood==='ABSOLUTE CHAOS'?'#ff914d':'#65e4f2';x.fillRect(0,0,1000,700);x.fillStyle='#152c35';x.font='bold 45px sans-serif';x.fillText('$PENG',50,70);x.font='16px monospace';x.fillText('CURRENT ENERGY /',50,126);x.save();x.translate(750,345);x.rotate(-.08);x.fillStyle='#152c35';x.beginPath();x.ellipse(0,70,145,210,0,0,Math.PI*2);x.fill();x.fillStyle='#f5f7f2';x.beginPath();x.ellipse(0,100,95,155,0,0,Math.PI*2);x.fill();x.fillStyle='#152c35';x.fillRect(-75,4,55,12);x.fillRect(20,4,55,12);x.beginPath();x.arc(-45,26,9,0,7);x.arc(45,26,9,0,7);x.fill();x.fillStyle='#ff914d';x.beginPath();x.moveTo(-20,50);x.lineTo(20,50);x.lineTo(0,78);x.fill();x.fillStyle='#65e4f2';x.beginPath();x.moveTo(-35,-120);x.lineTo(-65,-190);x.lineTo(15,-145);x.lineTo(25,-200);x.lineTo(65,-110);x.fill();x.restore();x.fillStyle='#152c35';x.font='900 66px sans-serif';let words=mood.split(' '),line='',y=275;for(let w of words){if(x.measureText(line+w).width>520){x.fillText(line,50,y);y+=76;line=''}line+=w+' '}x.fillText(line,50,y);x.font='18px monospace';x.fillText('STAY COLD. MOVE BOLD.',50,635)}
function spawnFish(){const g=$('#game');if(!g)return;g.innerHTML='';let b=document.createElement('button');b.className='fish';b.textContent='🐟';b.setAttribute('aria-label','Catch fish');b.style.left=Math.random()*Math.max(0,g.clientWidth-55)+'px';b.style.top=Math.random()*165+'px';b.onclick=()=>{score++;$('#stats').textContent=`SCORE ${score} · TIME ${remaining}s`;spawnFish()};g.appendChild(b)}
function startGame(){clearInterval(timer);score=0;remaining=20;$('#startgame').disabled=true;$('#stats').textContent='SCORE 0 · TIME 20s';spawnFish();timer=setInterval(()=>{remaining--;$('#stats').textContent=`SCORE ${score} · TIME ${remaining}s`;if(!remaining){clearInterval(timer);$('#game').innerHTML='<p style="padding:30px">Good catch. The colony thanks you. 🐟</p>';let best=Math.max(score,+(localStorage.getItem('peng-best')||0));localStorage.setItem('peng-best',best);$('#best').textContent='PERSONAL BEST: '+best;$('#startgame').disabled=false;$('#startgame').textContent='PLAY AGAIN ↗'}},1000)}
const penguinAudio=$('#penguin-audio'),volumeSlider=$('#volume'),soundButton=$('#sound');
let savedVolume=Number(localStorage.getItem('peng-volume')??35);if(!Number.isFinite(savedVolume))savedVolume=35;let previousVolume=Math.max(1,Math.min(100,savedVolume||35));volumeSlider.value=Math.max(0,Math.min(100,savedVolume));penguinAudio.volume=Number(volumeSlider.value)/100;penguinAudio.muted=true;
function updateAudioUI(){const on=!penguinAudio.paused&&!penguinAudio.muted&&penguinAudio.volume>0;soundButton.textContent=on?'MUTE':'SOUND OFF';soundButton.setAttribute('aria-label',on?'Mute penguin sound':'Play penguin sound');soundButton.setAttribute('aria-pressed',String(on));$('#volume-value').value=volumeSlider.value+'%';volumeSlider.setAttribute('aria-valuetext',volumeSlider.value+' percent')}
async function playPenguins(){try{await penguinAudio.play();$('#audio-status').textContent=''}catch(e){penguinAudio.muted=true;$('#audio-status').textContent='Sound could not play. Try again.'}updateAudioUI()}
soundButton.onclick=()=>{if(!penguinAudio.paused&&!penguinAudio.muted&&penguinAudio.volume>0){penguinAudio.muted=true}else{if(Number(volumeSlider.value)===0){volumeSlider.value=previousVolume;penguinAudio.volume=previousVolume/100}penguinAudio.muted=false;playPenguins()}updateAudioUI()};
volumeSlider.addEventListener('input',()=>{const value=Number(volumeSlider.value);penguinAudio.volume=value/100;penguinAudio.muted=value===0;if(value>0){previousVolume=value;playPenguins()}localStorage.setItem('peng-volume',String(value));updateAudioUI()});penguinAudio.addEventListener('error',()=>{$('#audio-status').textContent='Sound unavailable.';updateAudioUI()});updateAudioUI();
// Add the official account and launch post here when ready.
const campaign={handle:'',postId:''};
const taskNames=['Follow','Like','Repost','Quote','Comment','Notifications'];
let taskState=JSON.parse(localStorage.getItem('peng-tasks')||'{}');
function openTasks(){clearInterval(timer);lastFocus=document.activeElement;$('#windowtitle').textContent='PENG tasks';$('#content').innerHTML=`<div class="task-head"><h2>PENG tasks</h2><span id="progress">0 / 6</span></div><form class="handle-row" id="handleform"><label for="xhandle">X handle</label><input id="xhandle" placeholder="@yourhandle" maxlength="16" autocomplete="off" pattern="@?[A-Za-z0-9_]{1,15}" required><button class="retro">Save</button></form><p class="task-note" id="handle-status"></p><div class="task-list">${taskNames.map((n,i)=>`<div class="task-row"><div><div class="task-name"><i>${i+1}</i>${n}</div><p>${i===5?'Enable the bell on X.':'Open on X, then confirm here.'}</p></div><div class="task-actions"><button class="retro" data-task="${i}" disabled>Open X ↗</button><label><input type="checkbox" data-confirm="${i}" disabled> Done</label></div></div>`).join('')}</div><p class="task-note">Self-reported. X activity is not verified.</p><div class="task-footer"><button class="retro" id="back-room">← Room</button><span id="task-status">X account not linked yet.</span></div>`;$('#modal').classList.add('active');$('.close').focus();$('#xhandle').value=taskState.handle||'';$('#handle-status').textContent=taskState.handle?'Saved on this device.':'Save your handle to start.';$('#handleform').onsubmit=e=>{e.preventDefault();taskState={handle:$('#xhandle').value.replace(/^@/,''),done:[]};saveTasks();$('#handle-status').textContent='Saved on this device.';renderTaskState()};$('#back-room').textContent='← Desktop';$('#back-room').onclick=close;renderTaskState()}
function saveTasks(){localStorage.setItem('peng-tasks',JSON.stringify(taskState))}
function renderTaskState(){const ready=!!taskState.handle&&!!campaign.handle;document.querySelectorAll('[data-task]').forEach(b=>{let i=+b.dataset.task;b.disabled=!ready||(i>0&&i<5&&!campaign.postId);b.onclick=()=>{const p='https://x.com/'+campaign.handle;const post=p+'/status/'+campaign.postId;const links=[p,post,post,'https://x.com/intent/post?url='+encodeURIComponent(post),post,p];window.open(links[i],'_blank','noopener,noreferrer');taskState.opened=taskState.opened||[];if(!taskState.opened.includes(i))taskState.opened.push(i);saveTasks();renderTaskState()}});document.querySelectorAll('[data-confirm]').forEach(c=>{let i=+c.dataset.confirm;c.checked=(taskState.done||[]).includes(i);c.disabled=!ready||!(taskState.opened||[]).includes(i);c.onchange=()=>{taskState.done=(taskState.done||[]).filter(n=>n!==i);if(c.checked)taskState.done.push(i);saveTasks();renderTaskState()}});let n=(taskState.done||[]).length;$('#progress').textContent=n+' / 6';$('#task-status').textContent=campaign.handle?(n===6?'All tasks marked done.':'@'+campaign.handle):'X account not linked yet.'}
const station=$('#station');setInterval(()=>{$('#roomclock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},1000);

let enteringComputer=false,entryTimer;
function placeScreen(){if(innerWidth<=650)return;const w=innerWidth,h=innerHeight,ratio=1672/941;const iw=Math.min(w,h*ratio),ih=iw/ratio;const x=(w-iw)/2,y=(h-ih)/2;const hit=$('.screen-hit');hit.style.left=(x+iw*.54)+'px';hit.style.top=(y+ih*.245)+'px';hit.style.width=(iw*.168)+'px';hit.style.height=(ih*.245)+'px'}
placeScreen();window.addEventListener('resize',()=>{const hit=$('.screen-hit');if(innerWidth<=650){hit.style.cssText=''}placeScreen()});
function enterComputer(){if($('#desktop').classList.contains('visible')){openTasks();return}if(enteringComputer)return;enteringComputer=true;lastFocus=document.activeElement;const r=$('.screen-hit').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;const camera=$('.camera');camera.style.transformOrigin=cx+'px '+cy+'px';camera.style.setProperty('--zx',(innerWidth/2-cx)+'px');camera.style.setProperty('--zy',(innerHeight/2-cy)+'px');station.classList.add('entering');camera.classList.add('zoom');entryTimer=setTimeout(()=>{$('#desktop').hidden=false;requestAnimationFrame(()=>{$('#desktop').classList.add('visible');$('#exitdesktop').focus()});enteringComputer=false;$('#desktop').classList.remove('club-open')},matchMedia('(prefers-reduced-motion: reduce)').matches?0:1150)}
function exitComputer(){$('#club-video')?.pause();clearTimeout(entryTimer);close();$('#desktop').classList.remove('visible');setTimeout(()=>{$('#desktop').hidden=true;station.classList.remove('entering');$('.camera').classList.remove('zoom');$('.screen-hit').focus()},200);enteringComputer=false}
$('#exitdesktop').onclick=exitComputer;
const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');function syncVideoMotion(){document.querySelectorAll('.monitor-video,.desktop-video').forEach(v=>{v.muted=true;if(motionPreference.matches){v.pause();v.style.visibility='hidden'}else{v.style.visibility='visible';v.play().catch(()=>{})}})}motionPreference.addEventListener('change',syncVideoMotion);syncVideoMotion();
pages.collection=['PENG / collection',`<span class="pill">ART CONCEPT / NOT MINTED</span><h2>The first colony.</h2><p>Three character directions for the future collection.</p><div class="collection-grid"><div class="collectible"><img class="bird-art" src="character-0.jpg" alt="Explorer penguin portrait"><b>The Explorer</b><small>EXPEDITION CREW</small></div><div class="collectible" style="background:#d8e5f3"><img class="bird-art" src="character-1.jpg" alt="Captain penguin portrait"><b>The Captain</b><small>STATION CREW</small></div><div class="collectible" style="background:#e6dbef"><img class="bird-art" src="character-2.jpg" alt="Collector penguin portrait"><b>The Collector</b><small>CLUB CREW</small></div></div><p class="notice">Collection artwork, supply, pricing, network and holder rights are still being developed. No mint is live.</p>`];
pages.community=['PENG / community',`<h2>Make the next PENG.</h2><div class="card"><span class="eyebrow">FIRST PROMPT</span><p>What is your penguin doing on its first night at the club?</p></div><button class="action" data-next="mood">CREATE A POST ↗</button><button class="action" data-next="tasks">X TASKS ↗</button><p class="notice">Official community links and submissions will open when the PENG accounts are ready.</p>`];
pages.roadmap=['PENG / roadmap',`<h2>What comes next.</h2><div class="card"><b>01 / PROTOTYPE</b><p>Interactive clubhouse, penguin audio and shareable cards.</p></div><div class="card" style="background:#e0e9d9"><b>02 / COMMUNITY</b><p>Original character art, official channels and creative prompts.</p></div><div class="card" style="background:#e6dbef"><b>03 / COLLECTION</b><p>Finished NFT artwork, published holder benefits and a tested launch plan.</p></div><p class="notice">Proposed milestones. No launch dates or token release have been confirmed.</p>`];
function openProfile(){lastFocus=document.activeElement;$('#windowtitle').textContent='MY PENG';$('#content').innerHTML='<h2>Your place in the colony.</h2><div class="profile-badge"><b id="peng-name">Guest Penguin</b><span>IGLOO CLUB / VISITOR</span></div><form class="profile-form"><label for="pengname">Penguin name</label><input id="pengname" maxlength="30" required placeholder="Give your penguin a name"><button class="action">SAVE NAME</button></form><p class="notice">Saved on this device. NFT ownership is not connected.</p>';const name=localStorage.getItem('peng-name')||'Guest Penguin';$('#peng-name').textContent=name;$('#pengname').value=name==='Guest Penguin'?'':name;$('.profile-form').onsubmit=e=>{e.preventDefault();const name=$('#pengname').value.trim();if(!name)return;localStorage.setItem('peng-name',name);$('#peng-name').textContent=name};$('#modal').classList.add('active');$('.close').focus()}
$('#enterclub').onclick=()=>{$('#desktop').classList.add('club-open');syncClubVideo();$('.desktop-top b').textContent='THE IGLOO CLUB';$('.workstation').focus()};$('#clubexit').onclick=exitComputer;$('#clubradio').onclick=()=>{$('#sound').focus();$('.audio-controls').classList.add('radio-active');setTimeout(()=>$('.audio-controls').classList.remove('radio-active'),2000)};
function syncClubVideo(){const v=$('#club-video');v.muted=true;if(motionPreference.matches||!$('#desktop').classList.contains('club-open')){v.pause()}else{v.play().catch(()=>{})}}motionPreference.addEventListener('change',syncClubVideo);document.addEventListener('visibilitychange',()=>{if(document.hidden){$('#club-video').pause()}else{syncClubVideo()}});</script></html>
